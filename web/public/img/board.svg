<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b06a36"/><stop offset="0.5" stop-color="#9a5729"/><stop offset="1" stop-color="#7d421c"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.075" numOctaves="4" seed="21" result="n1"/>
      <feColorMatrix in="n1" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.11  0 0 0 0 0.04  0 0 0 1.5 -0.55" result="g1"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.4" numOctaves="2" seed="5" result="n2"/>
      <feColorMatrix in="n2" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.15  0 0 0 0 0.06  0 0 0 0.5 -0.15" result="g2"/>
      <feMerge result="g"><feMergeNode in="g1"/><feMergeNode in="g2"/></feMerge>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gg"/>
      <feBlend in="gg" in2="SourceGraphic" mode="multiply"/>
    </filter>
    <radialGradient id="sheen" cx="35%" cy="25%" r="80%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.28"/>
    </radialGradient>
    <linearGradient id="edgeLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity="0.75"/><stop offset="0.5" stop-color="#ffd9a8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2a1205" stop-opacity="0"/><stop offset="1" stop-color="#2a1205" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- slab -->
  <rect x="0" y="0" width="1200" height="440" rx="56" fill="url(#wood)" filter="url(#grain)"/>
  <rect x="0" y="0" width="1200" height="440" rx="56" fill="url(#sheen)"/>
  <rect x="0" y="0" width="1200" height="440" rx="56" fill="url(#vig)"/>
  <!-- rounded edge: lit top-left, shaded bottom-right -->
  <rect x="2" y="2" width="1196" height="436" rx="54" fill="none" stroke="url(#edgeLight)" stroke-width="4"/>
  <rect x="9" y="9" width="1182" height="422" rx="48" fill="none" stroke="#3a1a08" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="11" y="11" width="1178" height="418" rx="46" fill="none" stroke="#ffcf96" stroke-opacity="0.18" stroke-width="1"/>
  <rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="55" fill="none" stroke="#2a1205" stroke-width="1.5"/>
  <!-- carved centre line between the rows -->
  <line x1="215" y1="219.2" x2="985" y2="219.2" stroke="#3a1a08" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="215" y1="220.9" x2="985" y2="220.9" stroke="#ffd9a8" stroke-opacity="0.25" stroke-width="1" stroke-linecap="round"/>
</svg>
